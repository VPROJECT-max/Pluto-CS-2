name: Publish Pluto Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source and dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Validate tag and source version
        shell: pwsh
        run: |
          $header = Get-Content -Raw 'src/core/version/AppVersion.hpp'
          $match = [regex]::Match($header, 'current_text\s*\{\s*"(?<version>\d+\.\d+\.\d+)"\s*\}')
          if (-not $match.Success) { throw 'Unable to parse AppVersion.hpp' }
          $expected = 'v' + $match.Groups['version'].Value
          if ($env:GITHUB_REF_NAME -cne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match source version $expected"
          }

      - name: Build test executables
        shell: pwsh
        run: |
          $projects = @(
            'tests/UpdaterModelTests.vcxproj',
            'tests/UpdaterIoTests.vcxproj',
            'tests/SelfReplaceTests.vcxproj',
            'tests/PlutoBrandTests.vcxproj',
            'tests/OverlayPresentationTests.vcxproj',
            'tests/LocalAccountTests.vcxproj',
            'tests/ConfigDocumentTests.vcxproj',
            'tests/GeometryTests.vcxproj'
          )
          foreach ($project in $projects) {
            msbuild $project /t:Rebuild /p:Configuration=Debug /p:Platform=x64 /m:1 /nologo /v:minimal
            if ($LASTEXITCODE -ne 0) { throw "Test build failed: $project" }
          }

      - name: Run verification suites
        shell: pwsh
        run: |
          function Invoke-Checked {
            param(
              [string]$FilePath,
              [string[]]$ArgumentList = @(),
              [int]$TimeoutSeconds = 120
            )
            Write-Host "Running: $FilePath $($ArgumentList -join ' ')"
            $process = Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -NoNewWindow -PassThru
            try {
              if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
                taskkill.exe /PID $process.Id /T /F | Out-Null
                throw "$FilePath timed out after $TimeoutSeconds seconds"
              }
              if ($process.ExitCode -ne 0) {
                throw "$FilePath failed with exit code $($process.ExitCode)"
              }
            } finally {
              $process.Dispose()
            }
          }

          $executables = @(
            'tests/UpdaterModelTests.exe',
            'tests/SelfReplaceTests.exe',
            'tests/PlutoBrandTests.exe',
            'tests/OverlayPresentationTests.exe',
            'tests/LocalAccountTests.exe',
            'tests/ConfigDocumentTests.exe',
            'tests/GeometryTests.exe'
          )
          foreach ($executable in $executables) {
            Invoke-Checked $executable
          }

          Invoke-Checked 'powershell' @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'tests/http_fixture.ps1', '-Executable', 'tests/UpdaterIoTests.exe')
          foreach ($script in @('tests/Test-SyncOffsets.ps1', 'tests/Test-StarlineIntegration.ps1', 'tests/Test-UiContracts.ps1', 'tests/Test-PlutoReleaseContract.ps1')) {
            Invoke-Checked 'powershell' @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $script)
          }

      - name: Build verified one-file portable
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File 'tools/BuildPortable.ps1'

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            'dist/Pluto-portable.exe' `
            --verify-tag --generate-notes --title "Pluto $env:GITHUB_REF_NAME"
